<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Konfigurasi Master Data — Pusat Data Bantuan</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />

<script>

<style>

<body class="bg-slate-100 text-slate-800 antialiased">

<div class="flex min-h-screen">

  <!-- SIDEBAR -->

      <div class="w-10 h-10 rounded-xl bg-brand-600 flex items-center justify-center text-white shadow-lg shadow-brand-600/30">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542-.56-.97-1.053-.712a9.968 9.968 0 00-4.87 4.71 10.038 10.038 0 00-1.22 5.338c.09.62.732.99 1.305.806 2.32-.74 5.847-1.992 8.79-3.188.24-.1.48-.208.713-.32M9.594 3.94c.09-.542-.56-.97-1.053-.712a9.968 9.968 0 00-4.87 4.71M9.594 3.94l10.224 3.99M12.7 17.5l-1.426 4.073a.999.999 0 01-1.833.178L7.41 17.5H4.225a1 1 0 01-.997-1.098l.881-9.74A2.003 2.003 0 016.116 3h11.768a2.002 2.002 0 012.008 1.662l.88 9.74A1 1 0 0120.775 16h-3.185"/></svg>
      </div>
      <div>
        <h1 class="font-bold text-slate-900 leading-tight text-sm">Master Data Config</h1>
        <p class="text-[11px] text-slate-400">Dropdown dari Google Sheets</p>
      </div>
    </div>

    <nav class="flex-1 py-3 text-sm font-medium text-slate-600 overflow-y-auto scrollbar-thin" id="catNav">
      <!-- rendered -->
    </nav>

    <div class="p-4 border-t border-slate-100">
      <a href="index.html" class="flex items-center gap-2 text-xs font-semibold text-slate-500 hover:text-brand-600 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 15.75L3 12m0 0l3.75-3.75M3 12h18"/></svg>
        Kembali ke Dashboard
      </a>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="flex-1 ml-64">
    <header class="sticky top-0 z-20 bg-white/80 backdrop-blur border-b border-slate-200 px-8 py-4 flex items-center gap-4">
      <div>
        <h2 class="text-lg font-bold text-slate-900" id="pageTitle">Brand / Client</h2>
        <p class="text-xs text-slate-400" id="pageDesc">Kelola daftar brand atau client dari Google Sheets</p>
      </div>
      <div class="ml-auto flex items-center gap-2">
        <button id="btnImport" class="inline-flex items-center gap-2 text-sm font-semibold text-brand-600 bg-brand-50 hover:bg-brand-100 px-4 py-2 rounded-lg transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"/></svg>
          Impor dari Sheets
        </button>
        <button id="btnSave" class="inline-flex items-center gap-2 bg-brand-600 hover:bg-brand-700 text-white text-sm font-semibold px-4 py-2 rounded-lg shadow-md shadow-brand-600/25 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          Simpan Perubahan
        </button>
      </div>
    </header>

    <section class="px-8 py-6 space-y-5">
      <!-- Toolbar -->
      <div class="bg-white rounded-2xl border border-slate-200 p-4 flex flex-wrap items-center gap-3">
        <div class="relative flex-1 min-w-[200px]">
          <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/></svg>
          <input id="searchInput" type="text" placeholder="Cari nilai..." class="w-full pl-9 pr-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500/40 focus:border-brand-400" />
        </div>
        <button id="btnAdd" class="ml-auto inline-flex items-center gap-2 bg-slate-900 hover:bg-slate-700 text-white text-sm font-semibold px-4 py-2 rounded-lg transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
          Tambah
        </button>
      </div>

      <!-- Table -->
      <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="text-left text-[11px] uppercase tracking-wider text-slate-400 border-b border-slate-100">
                <th class="px-6 py-3 font-semibold w-16">No</th>
                <th class="px-4 py-3 font-semibold" id="thName">Nama</th>
                <th class="px-4 py-3 font-semibold" id="thParent">Parent</th>
                <th class="px-4 py-3 font-semibold text-right">Penggunaan</th>
                <th class="px-6 py-3 font-semibold text-center">Aktif</th>
                <th class="px-6 py-3 font-semibold text-right">Aksi</th>
              </tr>
            </thead>
            <tbody id="dataTable" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
        <div class="px-6 py-4 border-t border-slate-100 text-xs text-slate-400 flex justify-between">
          <span id="tableInfo">—</span>
          <span class="text-[11px] text-slate-400">Perubahan disimpan sementara di browser (mockup)</span>
        </div>
      </div>
    </section>
  </main>
</div>

<!-- MODAL ADD/EDIT -->
<div id="formModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm" onclick="closeForm()"></div>
  <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-md fade-in">
    <div class="px-6 py-5 border-b border-slate-100 flex items-center justify-between">
      <h3 class="font-bold text-slate-900" id="modalTitle">Tambah Data</h3>
      <button onclick="closeForm()" class="p-2 rounded-lg hover:bg-slate-100 text-slate-400"><svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg></button>
    </div>
    <div class="px-6 py-5 space-y-4">
      <input type="hidden" id="editId" />
      <div>
        <label class="text-xs font-semibold text-slate-500">Nama</label>
        <input id="inputName" type="text" class="mt-1 w-full text-sm border border-slate-200 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand-500/40 focus:border-brand-400" />
      </div>
      <div id="parentWrap">
        <label class="text-xs font-semibold text-slate-500">Parent Modul</label>
        <select id="inputParent" class="mt-1 w-full text-sm border border-slate-200 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand-500/40 bg-white"></select>
      </div>
      <div class="flex items-center gap-2">
        <input id="inputActive" type="checkbox" checked class="w-4 h-4 text-brand-600 rounded border-slate-300 focus:ring-brand-500" />
        <label for="inputActive" class="text-sm text-slate-700">Aktif</label>
      </div>
    </div>
    <div class="px-6 py-4 border-t border-slate-100 flex justify-end gap-2">
      <button onclick="closeForm()" class="text-sm font-semibold text-slate-500 px-4 py-2 rounded-lg hover:bg-slate-100 transition">Batal</button>
      <button onclick="saveItem()" class="bg-brand-600 hover:bg-brand-700 text-white text-sm font-semibold px-5 py-2 rounded-lg transition shadow-md shadow-brand-600/25">Simpan</button>
    </div>
  </div>
</div>

  { key: 'brand',        title: 'Brand / Client',        desc: 'Daftar brand atau client',                hasParent: false },
  { key: 'pic',          title: 'PIC Name',              desc: 'Daftar PIC (penanggung jawab lapangan)',  hasParent: false },
  { key: 'assignTo',     title: 'Assign To',             desc: 'Daftar petugas support (ANDRI, EDU, RAMA)', hasParent: false },
  { key: 'module',       title: 'Module',                desc: 'Daftar module aplikasi',                  hasParent: false },
  { key: 'submodule',    title: 'Sub-Module',            desc: 'Daftar sub-module per module',            hasParent: true  },
  { key: 'status',       title: 'Status Kasus',          desc: 'Daftar status penyelesaian',              hasParent: false },
  { key: 'supportCategory', title: 'Support Category',   desc: 'SERVICE atau BUG SYSTEM',                 hasParent: false },
  { key: 'billingStatus',   title: 'Billing Status',     desc: 'FREE / MONTHLY / ON-CALL',                hasParent: false },
  { key: 'billingCategory', title: 'Billing Category',   desc: 'Jenis layanan berbayar',                  hasParent: false },
  { key: 'priceList',    title: 'Ref Price List',        desc: 'Daftar pricelist',                        hasParent: false },
  { key: 'channel',      title: 'Channel Ticket',        desc: 'INTERNAL / WHATSAPP / EMAIL / PHONE',     hasParent: false },
  { key: 'supportType',  title: 'Support Type',          desc: 'Tipe support A / B / C',                  hasParent: false },
  { key: 'groupKpi',     title: 'Group KPI',             desc: 'Kelompok KPI support',                    hasParent: false },
  { key: 'groupKpiDesc', title: 'Deskripsi Group KPI',   desc: 'Keterangan group KPI',                    hasParent: false },
  { key: 'dayName',      title: 'Hari',                  desc: 'Nama hari untuk laporan',                 hasParent: false },
  { key: 'monthName',    title: 'Bulan',                 desc: 'Nama bulan untuk laporan',                hasParent: false }
];

let activeKey = 'brand';
let nextIds = {};
Object.keys(masters).forEach(k => { nextIds[k] = masters[k].length ? Math.max(...masters[k].map(x => x.id)) + 1 : 1; });

function renderNav() {
  const nav = document.getElementById('catNav');
  nav.innerHTML = categories.map(cat => {
    const count = (masters[cat.key] || []).length;
    const active = cat.key === activeKey ? 'bg-brand-50 text-brand-700 border-r-[3px] border-brand-600' : 'hover:bg-slate-50';
    return `<a href="#" onclick="setCategory('${cat.key}'); return false;" class="flex items-center justify-between px-5 py-2.5 transition ${active}">
      <span class="flex items-center gap-3">
        <span class="w-2 h-2 rounded-full ${cat.key === activeKey ? 'bg-brand-500' : 'bg-slate-300'}"></span>
        ${cat.title}
      </span>
      <span class="text-[10px] font-bold text-slate-400 bg-white border border-slate-100 rounded-full px-2 py-0.5">${count}</span>
    </a>`;
  }).join('');
}

function setCategory(key) {
  activeKey = key;
  const cat = categories.find(c => c.key === key);
  document.getElementById('pageTitle').textContent = cat.title;
  document.getElementById('pageDesc').textContent = cat.desc;
  document.getElementById('thParent').parentElement.style.display = cat.hasParent ? 'table-cell' : 'none';
  renderNav();
  renderTable();
}

function filteredItems() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  return (masters[activeKey] || []).filter(item => {
    const text = [item.name, item.parent || ''].join(' ').toLowerCase();
    return text.includes(q);
  });
}

function renderTable() {
  const cat = categories.find(c => c.key === activeKey);
  const items = filteredItems();
  document.getElementById('dataTable').innerHTML = items.map((item, i) => `
    <tr class="hover:bg-slate-50 transition">
      <td class="px-6 py-3.5 text-slate-400">${i + 1}</td>
      <td class="px-4 py-3.5 font-semibold text-slate-800">${item.name}</td>
      <td class="px-4 py-3.5 text-slate-500">${item.parent || '-'}</td>
      <td class="px-4 py-3.5 text-right text-slate-500">${item.count ? item.count.toLocaleString('id-ID') : '-'}</td>
      <td class="px-6 py-3.5 text-center">
        <button onclick="toggleActive(${item.id})" class="w-9 h-5 rounded-full transition ${item.active ? 'bg-brand-600' : 'bg-slate-300'} relative">
          <span class="absolute top-0.5 left-0.5 bg-white w-4 h-4 rounded-full transition-transform ${item.active ? 'translate-x-4' : ''}"></span>
        </button>
      </td>
      <td class="px-6 py-3.5 text-right">
        <button onclick="openEdit(${item.id})" class="text-xs font-semibold text-brand-600 hover:bg-brand-50 px-3 py-1.5 rounded-lg transition mr-1">Edit</button>
        <button onclick="deleteItem(${item.id})" class="text-xs font-semibold text-rose-500 hover:bg-rose-50 px-3 py-1.5 rounded-lg transition">Hapus</button>
      </td>
    </tr>
  `).join('') || `<tr><td colspan="6" class="px-6 py-12 text-center text-slate-400 text-sm">Tidak ada data</td></tr>`;
  document.getElementById('tableInfo').textContent = `Menampilkan ${items.length} dari ${(masters[activeKey] || []).length} data`;
}

function toggleActive(id) {
  const item = masters[activeKey].find(x => x.id === id);
  if (item) { item.active = !item.active; renderTable(); renderNav(); }
}

function deleteItem(id) {
  if (!confirm('Yakin ingin menghapus data ini?')) return;
  masters[activeKey] = masters[activeKey].filter(x => x.id !== id);
  renderTable(); renderNav();
}

let editId = null;
function openAdd() {
  editId = null;
  document.getElementById('modalTitle').textContent = 'Tambah ' + categories.find(c => c.key === activeKey).title;
  document.getElementById('inputName').value = '';
  document.getElementById('inputActive').checked = true;
  fillParentSelect();
  document.getElementById('formModal').classList.remove('hidden');
}
function openEdit(id) {
  editId = id;
  const item = masters[activeKey].find(x => x.id === id);
  document.getElementById('modalTitle').textContent = 'Edit ' + categories.find(c => c.key === activeKey).title;
  document.getElementById('inputName').value = item.name;
  document.getElementById('inputActive').checked = item.active !== false;
  fillParentSelect(item.parent || '');
  document.getElementById('formModal').classList.remove('hidden');
}
function fillParentSelect(selected) {
  const cat = categories.find(c => c.key === activeKey);
  const wrap = document.getElementById('parentWrap');
  wrap.style.display = cat.hasParent ? 'block' : 'none';
  if (!cat.hasParent) return;
  const sel = document.getElementById('inputParent');
  sel.innerHTML = (masters.module || []).map(m => `<option value="${m.name}" ${m.name === selected ? 'selected' : ''}>${m.name}</option>`).join('');
}
function closeForm() { document.getElementById('formModal').classList.add('hidden'); }
function saveItem() {
  const name = document.getElementById('inputName').value.trim();
  if (!name) return alert('Nama wajib diisi');
  const active = document.getElementById('inputActive').checked;
  const parent = categories.find(c => c.key === activeKey).hasParent ? document.getElementById('inputParent').value : '';
  if (editId) {
    const item = masters[activeKey].find(x => x.id === editId);
    item.name = name; item.active = active; item.parent = parent;
  } else {
    const id = nextIds[activeKey]++;
    masters[activeKey].push({ id, name, active, parent, count: 0 });
  }
  closeForm(); renderTable(); renderNav();
}

// event bindings
document.getElementById('btnAdd').addEventListener('click', openAdd);
document.getElementById('searchInput').addEventListener('input', renderTable);
document.getElementById('btnImport').addEventListener('click', () => alert('Mockup: data sudah diimpor otomatis dari Google Sheets saat file dibuat.'));
document.getElementById('btnSave').addEventListener('click', () => alert('Mockup: perubahan disimpan sementara di browser. Nantinya akan ditulis kembali ke Google Sheets terlebih dahulu, lalu disinkronkan.'));
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeForm(); });

// init
renderNav();
setCategory('brand');
</script>
