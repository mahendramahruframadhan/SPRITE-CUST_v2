<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login — Pusat Data Bantuan</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script>
  tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { brand: { 50:'#eef4ff',100:'#dfe9ff',200:'#c5d7ff',300:'#a2bcff',400:'#7d97fb',500:'#5f72f5',600:'#4a4fe9',700:'#3d3ece',800:'#3336a6',900:'#2f3383',950:'#1c1e4e' } } } } }
</script>
<style>
  body{font-family:'Inter',sans-serif;}
  .fade-in{animation:fadeIn .5s ease both;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-100 to-brand-50 p-4">

  <div class="w-full max-w-md fade-in">
    <!-- Logo Card -->
    <div class="bg-white rounded-2xl shadow-xl shadow-brand-600/10 border border-slate-200 p-8">
      <div class="flex items-center justify-center gap-3 mb-8">
        <div class="w-12 h-12 rounded-xl bg-brand-600 flex items-center justify-center text-white shadow-lg shadow-brand-600/30">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 002.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25zM6.75 12h.008v.008H6.75V12zm0 3h.008v.008H6.75V15zm0 3h.008v.008H6.75V18z"/></svg>
        </div>
        <div class="text-center">
          <h1 class="text-xl font-bold text-slate-900">Pusat Data Bantuan</h1>
          <p class="text-xs text-slate-400">Login untuk mengakses dashboard</p>
        </div>
      </div>

      <form id="loginForm" class="space-y-5" onsubmit="event.preventDefault(); doLogin();">
        <div id="errorBox" class="hidden bg-rose-50 border border-rose-200 text-rose-600 text-xs font-semibold px-4 py-3 rounded-lg">
          Email atau password salah.
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Email</label>
          <div class="relative">
            <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75"/></svg>
            <input id="email" type="email" value="finance@revota.id" class="w-full pl-9 pr-3 py-2.5 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500/40 focus:border-brand-400" placeholder="nama@perusahaan.id" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Password</label>
          <div class="relative">
            <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/></svg>
            <input id="password" type="password" value="password123" class="w-full pl-9 pr-3 py-2.5 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500/40 focus:border-brand-400" placeholder="••••••••" />
          </div>
        </div>

        <div class="flex items-center justify-between">
          <label class="flex items-center gap-2 text-xs text-slate-600">
            <input type="checkbox" checked class="w-4 h-4 text-brand-600 rounded border-slate-300 focus:ring-brand-500" />
            Ingat saya
          </label>
          <a href="#" class="text-xs font-semibold text-brand-600 hover:underline">Lupa password?</a>
        </div>

        <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white text-sm font-bold py-3 rounded-lg shadow-md shadow-brand-600/25 transition active:scale-95">
          Login
        </button>
      </form>

      <div class="mt-6 pt-6 border-t border-slate-100 text-center">
        <p class="text-[11px] text-slate-400">Demo login: <span class="font-semibold text-slate-600">finance@revota.id / password123</span></p>
      </div>
    </div>

    <p class="text-center text-xs text-slate-400 mt-6">© 2025 Pusat Data Bantuan — Mockup HTML</p>
  </div>

  <script>
    function doLogin(){
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      // Mock auth — peta email ke nama & role (sinkron dengan roles.html)
      const MOCK_USERS = {
        'rani@revota.id':    { name: 'Rani Admin',    role: 'Super Admin' },
        'budi.cs@revota.id': { name: 'Budi Santoso',  role: 'Admin CS' },
        'sari@revota.id':    { name: 'Sari Support',  role: 'Support' },
        'finance@revota.id': { name: 'Fajar Finance', role: 'Finance' },
        'vina@revota.id':    { name: 'Vina Viewer',   role: 'Viewer' }
      };
      if(email && password.length >= 6){
        const u = MOCK_USERS[email.toLowerCase()] || { name: email.split('@')[0], role: 'Viewer' };
        localStorage.setItem('loggedIn', 'true');
        localStorage.setItem('userEmail', email);
        localStorage.setItem('userName', u.name);
        localStorage.setItem('userRole', u.role);
        location.href = 'index.html';
      } else {
        document.getElementById('errorBox').classList.remove('hidden');
      }
    }
  </script>
</body>
</html>
