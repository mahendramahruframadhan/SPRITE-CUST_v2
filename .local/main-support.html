  <main class="flex-1 ml-64">
    <header class="sticky top-0 z-20 bg-white/80 backdrop-blur border-b border-slate-200 px-8 py-4 flex items-center gap-4">
      <div>
        <h2 class="text-lg font-bold text-slate-900">Input Kasus Support Baru</h2>
        <p class="text-xs text-slate-400">Satu halaman form untuk data main support — dropdown dari master data</p>
      </div>
      <div class="ml-auto flex items-center gap-2">
        <button type="button" onclick="resetForm()" class="text-sm font-semibold text-slate-500 px-4 py-2 rounded-lg hover:bg-slate-100 transition">Reset</button>
        <button type="button" onclick="saveForm()" class="inline-flex items-center gap-2 bg-brand-600 hover:bg-brand-700 text-white text-sm font-semibold px-5 py-2 rounded-lg shadow-md shadow-brand-600/25 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          Simpan ke Sheets
        </button>
      </div>
    </header>

    <section class="px-8 py-6">
      <form id="supportForm" class="bg-white rounded-2xl border border-slate-200 p-6 space-y-6" onsubmit="event.preventDefault(); saveForm();">
        <!-- Baris atas: nomor & tanggal -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
          <div>
            <label class="text-xs font-semibold text-slate-500">No</label>
            <input id="no" type="text" readonly class="mt-1 w-full text-sm bg-slate-50 border border-slate-200 rounded-lg px-3 py-2.5 text-slate-500" value="AUTO" />
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-500">Date Issue <span class="text-rose-500">*</span></label>
            <input id="dateIssue" type="date" required class="mt-1 w-full text-sm border border-slate-200 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand-500/40" />
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-500">Start Date</label>
            <input id="startDate" type="date" class="mt-1 w-full text-sm border border-slate-200 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand-500/40" />
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-500">Finish Date</label>
            <input id="finishDate" type="date" class="mt-1 w-full text-sm border border-slate-200 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand-500/40" />
          </div>
        </div>

        <!-- Client & PIC -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="text-xs font-semibold text-slate-500">Brand / Client <span class="text-rose-500">*</span></label>
            <input id="client" list="brandList" required class="mt-1 w-full text-sm border border-slate-200 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand-500/40" placeholder="Pilih atau ketik brand" />
            <datalist id="brandList"></datalist>
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-500">PIC Name</label>
            <input id="picName" list="picList" class="mt-1 w-full text-sm border border-slate-200 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand-500/40" placeholder="PIC lapangan" />
            <datalist id="picList"></datalist>
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-500">Assign To</label>
            <select id="assignTo" class="mt-1 w-full text-sm border border-slate-200 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand-500/40 bg-white"></select>
          </div>
        </div>

        <!-- Module & Sub Module -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="text-xs font-semibold text-slate-500">Module</label>
            <select id="module" class="mt-1 w-full text-sm border border-slate-200 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand-500/40 bg-white"></select>
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-500">Sub-Module</label>
            <select id="subModule" class="mt-1 w-full text-sm border border-slate-200 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand-500/40 bg-white"></select>
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-500">Location</label>
            <input id="location" type="text" class="mt-1 w-full text-sm border border-slate-200 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand-500/40" placeholder="cth. SHOP PALU" />
          </div>
        </div>

        <!-- Issue -->
        <div>
          <label class="text-xs font-semibold text-slate-500">Issue / Masalah <span class="text-rose-500">*</span></label>
          <textarea id="issue" rows="3" required class="mt-1 w-full text-sm border border-slate-200 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand-500/40" placeholder="Jelaskan masalah yang dilaporkan..."></textarea>
        </div>

        <!-- Kategori & Billing -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
          <div>
            <label class="text-xs font-semibold text-slate-500">Status</label>
            <select id="status" class="mt-1 w-full text-sm border border-slate-200 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand-500/40 bg-white"></select>
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-500">Support Category</label>
            <select id="supportCategory" class="mt-1 w-full text-sm border border-slate-200 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand-500/40 bg-white"></select>
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-500">Billing Status</label>
            <select id="billingStatus" class="mt-1 w-full text-sm border border-slate-200 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand-500/40 bg-white"></select>
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-500">Billing Category</label>
            <select id="billingCategory" class="mt-1 w-full text-sm border border-slate-200 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand-500/40 bg-white"></select>
          </div>
        </div>

        <!-- Price List & Charges -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 p-4 bg-slate-50 rounded-xl border border-slate-200">
          <div>
            <label class="text-xs font-semibold text-slate-500">Ref Price List</label>
            <select id="refPriceList" class="mt-1 w-full text-sm border border-slate-200 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand-500/40 bg-white"></select>
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-500">Channel Ticket</label>
            <select id="channelTicket" class="mt-1 w-full text-sm border border-slate-200 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand-500/40 bg-white"></select>
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-500">Support Type</label>
            <select id="supportType" class="mt-1 w-full text-sm border border-slate-200 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand-500/40 bg-white"></select>
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-500">Charges (Rp)</label>
            <div class="relative mt-1">
              <span class="absolute left-3 top-1/2 -translate-y-1/2 text-xs text-slate-400">Rp</span>
              <input id="charges" type="number" min="0" class="pl-8 pr-3 py-2.5 w-full text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500/40" placeholder="0" />
            </div>
            <p class="text-[10px] text-brand-600 mt-1 cursor-pointer hover:underline" onclick="autoFillCharges()">Isi otomatis dari price list</p>
          </div>
        </div>

        <!-- Group KPI & Notes -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="text-xs font-semibold text-slate-500">Group KPI</label>
            <select id="groupKpi" class="mt-1 w-full text-sm border border-slate-200 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand-500/40 bg-white"></select>
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-500">Group KPI Description</label>
            <select id="groupKpiDesc" class="mt-1 w-full text-sm border border-slate-200 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand-500/40 bg-white"></select>
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-500">Completion Notes</label>
            <input id="completionNotes" type="text" class="mt-1 w-full text-sm border border-slate-200 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand-500/40" placeholder="cth. SAME DAY SERVICE" />
          </div>
        </div>

        <!-- Hidden / meta -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="text-xs font-semibold text-slate-500">Bulan</label>
            <select id="monthName" class="mt-1 w-full text-sm border border-slate-200 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand-500/40 bg-white"></select>
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-500">Weeknum</label>
            <input id="weeknum" type="number" min="1" max="53" class="mt-1 w-full text-sm border border-slate-200 rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand-500/40" />
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-500">RECORD_UUID</label>
            <input id="recordUuid" type="text" readonly class="mt-1 w-full text-xs bg-slate-50 border border-slate-200 rounded-lg px-3 py-2.5 text-slate-500 font-mono" value="" />
          </div>
        </div>

        <!-- Preview JSON -->
        <div>
          <label class="text-xs font-semibold text-slate-500">Preview Data (JSON)</label>
          <textarea id="previewJson" rows="4" readonly class="mt-1 w-full text-xs font-mono bg-slate-900 text-emerald-400 border border-slate-200 rounded-lg px-3 py-2.5"></textarea>
        </div>
      </form>
    </section>
  </main>
</div>

function fillSelect(id, arr, useName=true){
  const el=document.getElementById(id); el.innerHTML='<option value="">-- Pilih --</option>';
  arr.forEach(item=>{
    const val = useName ? item.name : item;
    const label = useName ? item.name : item;
    const opt=document.createElement('option'); opt.value=val; opt.textContent=label; el.appendChild(opt);
  });
}
function fillDatalist(id, arr){
  const el=document.getElementById(id); el.innerHTML='';
  arr.forEach(item=>{ const opt=document.createElement('option'); opt.value=item.name; el.appendChild(opt); });
}
function uuid(){ return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0,v=c=='x'?r:(r&0x3|0x8); return v.toString(16); }); }

function init(){
  fillDatalist('brandList', masters.brand||[]);
  fillDatalist('picList', masters.pic||[]);
  fillSelect('assignTo', masters.assignTo||[]);
  fillSelect('module', masters.module||[]);
  fillSelect('status', masters.status||[]);
  fillSelect('supportCategory', masters.supportCategory||[]);
  fillSelect('billingStatus', masters.billingStatus||[]);
  fillSelect('billingCategory', masters.billingCategory||[]);
  fillSelect('refPriceList', [{name:'PRICELIST - 1'},{name:'PRICELIST - 2'}]);
  fillSelect('channelTicket', masters.channel||[]);
  fillSelect('supportType', masters.supportType||[]);
  fillSelect('groupKpi', masters.groupKpi||[]);
  fillSelect('groupKpiDesc', masters.groupKpiDesc||[]);
  fillSelect('monthName', masters.monthName||[]);
  document.getElementById('recordUuid').value = uuid();
  updateSubModule();
  updatePreview();
}

function updateSubModule(){
  const mod=document.getElementById('module').value;
  const subMods=(masters.submodule||[]).filter(s=>s.parent===mod || !mod);
  fillSelect('subModule', subMods);
}
document.getElementById('module').addEventListener('change', updateSubModule);

function autoFillCharges(){
  const cat=document.getElementById('billingCategory').value;
  const pl=document.getElementById('refPriceList').value;
  if(!cat){ alert('Pilih Billing Category terlebih dahulu'); return; }
  const item=priceListData.find(p=>p.category===cat && p.active);
  if(!item){ alert('Kategori tidak ditemukan di price list'); return; }
  const price = pl.includes('1') ? item.pl1 : item.pl2;
  document.getElementById('charges').value = price || 0;
  updatePreview();
}

function getVal(id){ const el=document.getElementById(id); return el ? el.value : ''; }
function updatePreview(){
  const data={
    no:getVal('no'), dateIssue:getVal('dateIssue').replace(/-/g,''), startDate:getVal('startDate').replace(/-/g,''), finishDate:getVal('finishDate').replace(/-/g,''),
    client:getVal('client'), picName:getVal('picName'), assignTo:getVal('assignTo'),
    module:getVal('module'), subModule:getVal('subModule'), location:getVal('location'), issue:getVal('issue'),
    status:getVal('status'), supportCategory:getVal('supportCategory'), billingStatus:getVal('billingStatus'), billingCategory:getVal('billingCategory'),
    refPriceList:getVal('refPriceList'), channelTicket:getVal('channelTicket'), supportType:getVal('supportType'), charges:getVal('charges'),
    completionNotes:getVal('completionNotes'), groupKpi:getVal('groupKpi'), groupKpiDesc:getVal('groupKpiDesc'),
    monthName:getVal('monthName'), weeknum:getVal('weeknum'), recordUuid:getVal('recordUuid')
  };
  document.getElementById('previewJson').value = JSON.stringify(data, null, 2);
}

document.querySelectorAll('#supportForm input, #supportForm select, #supportForm textarea').forEach(el=>{
  el.addEventListener('input', updatePreview);
  el.addEventListener('change', updatePreview);
});

function resetForm(){
  document.getElementById('supportForm').reset();
  document.getElementById('recordUuid').value = uuid();
  updateSubModule();
  updatePreview();
}
function saveForm(){
  const required=['dateIssue','client','issue'];
  for(const id of required){ if(!document.getElementById(id).value){ alert('Field wajib belum diisi'); document.getElementById(id).focus(); return; } }
  alert('Mockup: data siap ditulis ke Google Sheets.\n\n' + document.getElementById('previewJson').value.substring(0,400)+'...');
}
